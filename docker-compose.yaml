version: '3.9'

# ==================================================
# Pesquisa Eleitoral — Docker Compose Simplificado
# Serviços: App (4444) + PostgreSQL
# ==================================================

services:

  # --------------------------------------------------
  # Aplicação Principal (Backend + Frontend)
  # --------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    container_name: pesquisa_app
    restart: unless-stopped
    ports:
      - "4444:4444"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app-router.rule=Host(`pesquisa.techinteligente.site`)"
      - "traefik.http.services.app-service.loadbalancer.server.port=4444"
    environment:
      NODE_ENV: production
      PORT: 4444
      APP_URL: ${APP_URL:-http://localhost:4444}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@pesquisa_postgres:5432/${POSTGRES_DB:-pesquisa_eleitoral}
      JWT_SECRET: ${JWT_SECRET:-troque_por_uma_string_muito_secreta}
      # WhatsApp Meta Cloud API
      META_WA_TOKEN: ${META_WA_TOKEN:-}
      META_PHONE_ID: ${META_PHONE_ID:-}
      META_TEMPLATE_NAME: ${META_TEMPLATE_NAME:-pesquisa_link}
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@pesquisa.com}
    depends_on:
      pesquisa_postgres:
        condition: service_healthy
    networks:
      - pesquisa_net
      - coolify
    volumes:
      - ./scripts:/app/scripts:ro  # Seed script acessível

  # --------------------------------------------------
  # PostgreSQL 16
  # --------------------------------------------------
  pesquisa_postgres:
    image: postgres:16-alpine
    container_name: pesquisa_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pesquisa_eleitoral}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5435:5432"  # Porta não-padrão, acessível apenas localmente
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-pesquisa_eleitoral}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - pesquisa_net

# ==================================================
# Volumes persistentes
# ==================================================
volumes:
  postgres_data:
    driver: local

# ==================================================
# Rede isolada
# ==================================================
networks:
  pesquisa_net:
    driver: bridge
    name: pesquisa_eleitoral_net
  coolify:
    external: true
