<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Painel Administrativo | Pesquisa Eleitoral</title>
  <meta name="description" content="Acesse o painel administrativo do sistema de pesquisa eleitoral.">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-base);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 70% 60% at 25% 15%, rgba(99,102,241,0.14) 0%, transparent 55%),
        radial-gradient(ellipse 55% 50% at 78% 88%, rgba(139,92,246,0.12) 0%, transparent 55%),
        radial-gradient(ellipse 40% 50% at 60% 40%, rgba(59,130,246,0.05) 0%, transparent 60%);
      pointer-events: none;
      animation: bgShift 12s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      from { opacity: 0.8; }
      to   { opacity: 1; }
    }

    /* Floating orbs */
    body::after {
      content: '';
      position: fixed;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99,102,241,0.06), transparent 70%);
      top: -100px; right: -100px;
      animation: float1 8s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes float1 {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-20px, 20px) scale(1.05); }
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 16px;
      animation: loginFadeIn 0.6s cubic-bezier(0.34, 1.1, 0.64, 1) both;
    }

    @keyframes loginFadeIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }

    .login-logo-icon {
      width: 68px;
      height: 68px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 36px rgba(99,102,241,0.45), 0 0 0 1px rgba(255,255,255,0.08) inset;
      position: relative;
      animation: iconGlow 3s ease-in-out infinite;
    }

    @keyframes iconGlow {
      0%, 100% { box-shadow: 0 8px 36px rgba(99,102,241,0.4), 0 0 0 1px rgba(255,255,255,0.08) inset; }
      50%       { box-shadow: 0 8px 50px rgba(99,102,241,0.6), 0 0 0 1px rgba(255,255,255,0.1) inset; }
    }

    .login-logo-icon::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 26px;
      border: 1px solid rgba(99,102,241,0.25);
      animation: ringPulse 3s ease-in-out infinite;
    }

    @keyframes ringPulse {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.04); }
    }

    .login-logo h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #c7d2fe, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }

    .login-logo p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 5px;
    }

    .login-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 99px;
      padding: 3px 10px;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-top: 10px;
    }

    .login-badge-dot {
      width: 5px; height: 5px;
      background: var(--primary);
      border-radius: 50%;
      animation: badgePulse 2s ease-in-out infinite;
      box-shadow: 0 0 4px var(--primary);
    }

    @keyframes badgePulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .login-card {
      background: rgba(13, 22, 40, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(30, 47, 71, 0.8);
      border-radius: 26px;
      padding: 36px;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.02) inset;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(99,102,241,0.6), var(--accent), rgba(99,102,241,0.6), transparent);
    }

    .login-card::after {
      content: '';
      position: absolute;
      bottom: 0; right: 0;
      width: 160px; height: 160px;
      background: radial-gradient(circle, rgba(99,102,241,0.06), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }

    .login-card h2 {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-primary);
      margin-bottom: 6px;
      letter-spacing: -0.4px;
    }

    .login-card > p {
      font-size: 13.5px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .error-alert {
      background: rgba(239,68,68,0.08);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 13.5px;
      color: #fca5a5;
      margin-bottom: 20px;
      display: none;
      border-left: 3px solid var(--danger);
    }

    .error-alert.show { display: flex; align-items: center; gap: 8px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">
      <div class="login-logo-icon">🗳️</div>
      <h1>Pesquisa Eleitoral</h1>
      <p>Sistema de Gestão de Pesquisas</p>
      <div class="login-badge">
        <div class="login-badge-dot"></div>
        Painel Administrativo
      </div>
    </div>

    <div class="login-card">
      <h2>Bem-vindo de volta</h2>
      <p>Faça login para acessar o painel administrativo.</p>

      <div class="error-alert" id="error-alert">
        <span>⚠️</span>
        <span id="error-message">Credenciais inválidas.</span>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="seu@email.com"
            autocomplete="username"
            required
          >
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg" id="btn-login" style="margin-top:8px;">
          <span id="btn-text">Entrar no Painel</span>
          <div class="spinner hidden" id="btn-spinner"></div>
        </button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorAlert = document.getElementById('error-alert');
    const errorMsg = document.getElementById('error-message');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const btnLogin = document.getElementById('btn-login');

    // Verificar se já está autenticado
    if (localStorage.getItem('authToken')) {
      window.location.href = '/admin/dashboard';
    }

    function setLoading(loading) {
      btnLogin.disabled = loading;
      btnText.textContent = loading ? 'Autenticando...' : 'Entrar no Painel';
      btnSpinner.classList.toggle('hidden', !loading);
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorAlert.classList.add('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.remove('show');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Preencha e-mail e senha.');
        return;
      }

      setLoading(true);
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Erro ao fazer login.');
          return;
        }

        localStorage.setItem('authToken', data.token);
        localStorage.setItem('userEmail', data.user.email);
        window.location.href = '/admin/dashboard';
      } catch (err) {
        showError('Erro de conexão com o servidor.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
