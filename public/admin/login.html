<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Painel Administrativo | Pesquisa Eleitoral</title>
  <meta name="description" content="Acesse o painel administrativo do sistema de pesquisa eleitoral.">
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg-base);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 30% 20%, rgba(99,102,241,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 50% 40% at 75% 85%, rgba(139,92,246,0.1) 0%, transparent 60%);
      pointer-events: none;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 16px;
      animation: fadeUp 0.5s ease both;
    }

    .login-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo-icon {
      width: 64px;
      height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 16px;
      box-shadow: 0 8px 32px rgba(99,102,241,0.4);
    }

    .login-logo h1 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .login-logo p {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 6px;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 36px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.5);
    }

    .login-card h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
    }

    .login-card p {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
    }

    .error-alert {
      background: rgba(239,68,68,0.1);
      border: 1px solid rgba(239,68,68,0.3);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      font-size: 14px;
      color: #fca5a5;
      margin-bottom: 16px;
      display: none;
    }

    .error-alert.show { display: flex; align-items: center; gap: 8px; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-logo">
      <div class="login-logo-icon">🗳️</div>
      <h1>Pesquisa Eleitoral</h1>
      <p>Sistema de Gestão de Pesquisas</p>
    </div>

    <div class="login-card">
      <h2>Bem-vindo de volta</h2>
      <p>Faça login para acessar o painel administrativo.</p>

      <div class="error-alert" id="error-alert">
        <span>⚠️</span>
        <span id="error-message">Credenciais inválidas.</span>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">E-mail</label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="seu@email.com"
            autocomplete="username"
            required
          >
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Senha</label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>
        <button type="submit" class="btn btn-primary w-full btn-lg" id="btn-login" style="margin-top:8px;">
          <span id="btn-text">Entrar no Painel</span>
          <div class="spinner hidden" id="btn-spinner"></div>
        </button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorAlert = document.getElementById('error-alert');
    const errorMsg = document.getElementById('error-message');
    const btnText = document.getElementById('btn-text');
    const btnSpinner = document.getElementById('btn-spinner');
    const btnLogin = document.getElementById('btn-login');

    // Verificar se já está autenticado
    if (localStorage.getItem('authToken')) {
      window.location.href = '/admin/dashboard';
    }

    function setLoading(loading) {
      btnLogin.disabled = loading;
      btnText.textContent = loading ? 'Autenticando...' : 'Entrar no Painel';
      btnSpinner.classList.toggle('hidden', !loading);
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorAlert.classList.add('show');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.classList.remove('show');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        showError('Preencha e-mail e senha.');
        return;
      }

      setLoading(true);
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          showError(data.error || 'Erro ao fazer login.');
          return;
        }

        localStorage.setItem('authToken', data.token);
        localStorage.setItem('userEmail', data.user.email);
        window.location.href = '/admin/dashboard';
      } catch (err) {
        showError('Erro de conexão com o servidor.');
      } finally {
        setLoading(false);
      }
    });
  </script>
</body>
</html>
